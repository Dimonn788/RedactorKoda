<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Code Runner Pro</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0A192F 0%, #000000 100%);
            color: #E6E6E6;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8em;
            font-weight: bold;
            color: #00FFFF; /* Неоново-голубой акцент */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        .nav a {
            color: #B3B3B3;
            text-decoration: none;
            margin-left: 25px;
            font-size: 1em;
            transition: color 0.3s;
        }
        .nav a:hover {
            color: #00FFFF;
        }
        /* Секция Hero */
        .hero {
            padding: 100px 20px;
            max-width: 800px;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .hero p {
            font-size: 1.2em;
            margin-bottom: 40px;
            color: #B3B3B3;
        }
        /* Кнопка */
        .cta-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: #007ACC; /* Синий акцент */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0, 122, 204, 0.4);
        }
        .cta-button:hover {
            background-color: #0099FF;
            transform: translateY(-2px);
        }
        /* Футер */
        footer {
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.3);
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">CODE RUNNER PRO</div>
    <nav class="nav">
        <a href="about.html">О Нас</a>
        <a href="docs.html">Документация</a>
    </nav>
</header>

    <main class="hero">
        <h1>🚀 Мгновенное тестирование кода.<br>Без настройки.</h1>
        <p>Ваша песочница для HTML/CSS. Запускайте, редактируйте и смотрите результат в реальном времени прямо в браузере.</p>
        
        <a href="editor.html" class="cta-button">НАЧАТЬ РЕДАКТИРОВАНИЕ</a>
    </main>

    <footer>
        &copy; 2025 Code Runner Pro. Все права защищены.
    </footer>

</body>
</html>
